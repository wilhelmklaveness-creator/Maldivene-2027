<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Jawakara 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Familiens reiseapp til Jawakara Islands Maldives, februar 2027">
<meta name="theme-color" content="#0a6c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jawakara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: lagunebånd øverst, kort på sand, fast fanerad nederst (tommelvennlig). */
:root{
  --sea:#0a6c86;        /* dyp lagune */
  --lagoon:#25c2c0;     /* turkis */
  --coral:#ff6b5b;      /* korall */
  --coral-soft:#ffe3dc;
  --palm:#21805a;       /* palmeblad */
  --sun:#ffb938;
  --sand:#fbf5ea;       /* sandbakgrunn */
  --card:#ffffff;
  --ink:#0d2c3b;
  --muted:#5b7380;
  --line:#e6ddcc;
  --chip:#eef7f6;
  --good:#1f8a5b; --warn:#c77700; --bad:#c2412f;
  --hero-a:#0a6c86; --hero-b:#18a9b4; --hero-c:#7fe0d4;
  --font-d:"Fredoka","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
  --shadow:0 1px 2px rgba(13,44,59,.06),0 6px 18px rgba(13,44,59,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#5fd3e0;--lagoon:#3fd8cf;--coral:#ff8a7c;--coral-soft:#4a2723;--palm:#53c08e;--sun:#ffc85e;
  --sand:#06202b;--card:#0c2f3d;--ink:#e6f4f3;--muted:#93b2bb;--line:#1b4656;--chip:#123c4b;
  --good:#5fd39b;--warn:#ffc45e;--bad:#ff8a7c;
  --hero-a:#04394a;--hero-b:#085a6b;--hero-c:#0f7c80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#5fd3e0;--lagoon:#3fd8cf;--coral:#ff8a7c;--coral-soft:#4a2723;--palm:#53c08e;--sun:#ffc85e;
  --sand:#06202b;--card:#0c2f3d;--ink:#e6f4f3;--muted:#93b2bb;--line:#1b4656;--chip:#123c4b;
  --good:#5fd39b;--warn:#ffc45e;--bad:#ff8a7c;
  --hero-a:#04394a;--hero-b:#085a6b;--hero-c:#0f7c80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
a{color:var(--sea)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Hero */
.hero{position:relative;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 18px);background:linear-gradient(165deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);color:#fff;overflow:hidden}
.hero .wrap{position:relative;z-index:2;padding-block:4px 54px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-d);font-weight:700;letter-spacing:.02em;font-size:1.05rem;opacity:.95}
.brand small{display:block;font-family:var(--font-b);font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.me-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px 6px 6px;color:#fff;font-weight:700}
.me-btn .av{width:30px;height:30px;font-size:18px}
.hero h1{font-size:clamp(1.7rem,6vw,2.4rem);margin-top:18px}
.hero .sub{opacity:.92;margin-top:4px}
.palm{position:absolute;right:-18px;bottom:22px;width:170px;height:auto;z-index:1;opacity:.28;pointer-events:none}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;z-index:1;display:block}
.waves path{fill:var(--sand)}

/* Countdown */
.count{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.count div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:8px 12px;min-width:64px;text-align:center}
.count b{display:block;font-family:var(--font-d);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.9}

/* Main */
main{display:block;margin-top:-20px;position:relative;z-index:3}
.view{display:grid;gap:16px;padding-block:4px 24px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:8px}
.spacer{flex:1}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;text-decoration:none;border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--sea);color:#fff;min-height:44px}
:root .btn{color:var(--card)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.86rem;border-radius:10px}
.iconbtn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:1.1rem;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--chip)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--lagoon);outline:none}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:0}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

/* Segmented sub-tabs */
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:transparent;border-radius:10px;padding:8px 12px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button[aria-selected=true]{background:var(--sea);color:var(--card)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--lagoon);border-color:var(--lagoon);color:#06303a}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:800;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.pill.good{background:var(--chip);color:var(--good)}
.pill.warn{background:var(--chip);color:var(--warn)}

/* Avatars & leaderboard */
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-size:22px;background:var(--chip);flex:0 0 auto}
.lb{display:grid;gap:10px}
.lb-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lb-name{font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lagoon),var(--sea));border-radius:99px}
.lb-pts{font-family:var(--font-d);font-size:1.3rem;font-variant-numeric:tabular-nums}
.lb-pts small{font-family:var(--font-b);font-size:.7rem;color:var(--muted);display:block;text-align:right}

/* Lists */
.list{display:grid;gap:2px}
.li{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--lagoon);display:inline-grid;place-items:center;flex:0 0 auto;margin:0;background:var(--card)}
.check:checked{background:var(--lagoon)}
.check:checked::after{content:"";width:7px;height:12px;border:solid #06303a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.progress{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--palm)}

/* Challenges */
.ch{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ch:last-child{border-bottom:0}
.ch .t{font-weight:700}
.ch .d{font-size:.84rem;color:var(--muted)}
.ch-btn{border:2px solid var(--lagoon);background:transparent;border-radius:12px;padding:6px 10px;font-weight:800;color:var(--sea);min-width:78px;min-height:40px;font-variant-numeric:tabular-nums}
.ch-btn[aria-pressed=true]{background:var(--lagoon);color:#06303a}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--chip);font-size:.78rem;font-weight:700}
.badge .ic{font-size:30px;line-height:1;filter:grayscale(1);opacity:.35}
.badge.on .ic{filter:none;opacity:1}
.badge.on{background:var(--coral-soft)}
.badge small{font-weight:600;color:var(--muted);font-size:.7rem}

/* Quiz */
.q-opts{display:grid;gap:8px;margin-top:12px}
.q-opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:700;min-height:48px}
.q-opt.right{border-color:var(--good);background:var(--chip)}
.q-opt.wrong{border-color:var(--bad);background:var(--coral-soft)}
.q-ex{margin-top:12px;padding:12px;border-radius:12px;background:var(--chip);font-size:.92rem}

/* Learn */
.learn{display:grid;gap:10px}
details.lc{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0}
details.lc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:800}
details.lc summary::-webkit-details-marker{display:none}
details.lc summary .em{font-size:26px}
details.lc summary .s2{display:block;font-weight:600;color:var(--muted);font-size:.82rem}
details.lc .body{padding:0 16px 16px;display:grid;gap:8px}
details.lc[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.fish{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.fish b{font-weight:800}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.dv .w{font-weight:800;color:var(--sea)}

/* Plan / calendar */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.day{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;text-align:center;min-width:58px}
.day b{display:block;font-family:var(--font-d);font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.day span{font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.day[aria-pressed=true]{border-color:var(--sea);background:var(--sea);color:var(--card)}
.day[aria-pressed=true] span{color:inherit;opacity:.85}
.day.trip{border-color:var(--lagoon)}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-family:var(--font-d);font-weight:600;color:var(--sea);font-variant-numeric:tabular-nums}
.ev .tt{font-weight:800}
.ev .dd{font-size:.84rem;color:var(--muted)}
.ev.fixed .tt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:6px;vertical-align:middle}
.deadline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.deadline:last-child{border-bottom:0}
.dl-date{font-family:var(--font-d);text-align:center;min-width:52px;border-radius:12px;background:var(--chip);padding:4px 6px;line-height:1.1}
.dl-date b{display:block;font-size:1.2rem}
.dl-date span{font-size:.7rem;text-transform:uppercase;font-weight:800;color:var(--muted)}
.flight{display:grid;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:14px}
.flight .fh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Resort */
.act{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.act:last-child{border-bottom:0}
.act .ah{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.act .an{font-weight:800}
.act .ad{font-size:.9rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{background:var(--chip);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-d);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}

/* Weather */
.wx-now{display:flex;gap:14px;align-items:center}
.wx-now .ic{font-size:52px;line-height:1}
.wx-now .tp{font-family:var(--font-d);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.wx-days{display:grid;grid-template-columns:repeat(7,minmax(60px,1fr));gap:6px;overflow-x:auto}
.wx-d{text-align:center;background:var(--chip);border-radius:12px;padding:8px 4px;font-size:.8rem}
.wx-d b{display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.wx-d .i{font-size:22px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:320px;height:auto}
.tides{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Clocks / currency */
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.clock{background:var(--chip);border-radius:14px;padding:12px}
.clock b{display:block;font-family:var(--font-d);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-size:.8rem;font-weight:700;color:var(--muted)}
.fx-out{display:grid;gap:6px;margin-top:10px}
.fx-line{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--chip);border-radius:12px;font-variant-numeric:tabular-nums}
.fx-line b{font-family:var(--font-d);font-size:1.15rem}

.count .big-days{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.18);padding:6px 14px}
.count .big-days b{font-size:clamp(2.2rem,9vw,3rem)}
.count .big-days span{font-size:.9rem;letter-spacing:.1em}
.count .hm{background:none;border:0;text-align:left;align-self:center;font-size:.9rem;opacity:.95;min-width:0}
/* Weather scene */
.scene{position:relative;border-radius:16px;overflow:hidden;margin:-4px -4px 0}
.scene svg{display:block;width:100%;height:auto}
.scene .ov{position:absolute;left:16px;top:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.scene .ov .tp{font-family:var(--font-d);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.scene .ov .tx{font-weight:800}
.wx-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.wx-facts div{background:var(--chip);border-radius:12px;padding:8px;text-align:center}
.wx-facts b{display:block;font-family:var(--font-d);font-size:1.1rem;font-variant-numeric:tabular-nums}
.wx-facts span{font-size:.72rem;color:var(--muted);font-weight:700}
@media (max-width:420px){.wx-facts{grid-template-columns:repeat(2,1fr)}}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite}
.drift{animation:drift 26s ease-in-out infinite alternate}
.drift2{animation:drift 34s ease-in-out infinite alternate-reverse}
.wave1{animation:wave 7s ease-in-out infinite alternate}
.wave2{animation:wave 9s ease-in-out infinite alternate-reverse}
.drop{animation:drop 1.1s linear infinite}
.sway{transform-origin:50% 100%;transform-box:fill-box;animation:sway 6s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes wave{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
@keyframes drop{from{transform:translateY(-20px);opacity:0}30%{opacity:1}to{transform:translateY(60px);opacity:0}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
@media (prefers-reduced-motion:reduce){.spin,.drift,.drift2,.wave1,.wave2,.drop,.sway{animation:none}}
.tab-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px}
.chat{display:flex;flex-direction:column;gap:6px;min-height:50vh}
.msg{max-width:82%;display:grid;gap:2px}
.msg .bub{padding:8px 12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);overflow-wrap:anywhere;white-space:pre-wrap}
.msg .meta{font-size:.72rem;color:var(--muted);font-weight:700;padding:0 6px}
.msg.mine{align-self:flex-end;justify-items:end}
.msg.mine .bub{background:var(--sea);color:var(--card)}
.msg .who{display:flex;gap:6px;align-items:center}
.daysep{align-self:center;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 0}
.chatbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--card);padding-block:8px}
.chatbar textarea{min-height:44px;max-height:140px;flex:1;min-width:0}
/* News ticker */
.ticker{position:relative;overflow:hidden;border-radius:12px;background:var(--sea);color:var(--card);padding:8px 0;margin-bottom:10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-track{display:inline-flex;gap:36px;white-space:nowrap;padding-left:100%;animation:tick var(--tick-dur,60s) linear infinite;font-weight:800;font-size:.92rem}
.ticker:hover .ticker-track,.ticker:focus-within .ticker-track{animation-play-state:paused}
.ticker a{color:inherit;text-decoration:none}
.ticker a::before{content:"●";color:var(--coral);margin-right:10px;font-size:.7rem;vertical-align:2px}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker{display:none}}
.news-item{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:0}
.news-item a{font-weight:800;color:var(--ink);text-decoration:none}

function dparse(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }
function diso(dt){ return dt.toISOString().slice(0,10); }
function fmtDay(iso){ const d=dparse(iso); return `${WD[d.getUTCDay()]} ${d.getUTCDate()}. ${MON[d.getUTCMonth()]}`; }
function fmtInOffset(ms, off, withDay){ const d=new Date(ms+off*3600e3); const hh=String(d.getUTCHours()).padStart(2,"0"), mm=String(d.getUTCMinutes()).padStart(2,"0"); return (withDay?`${WD[d.getUTCDay()]} `:"")+`${hh}.${mm}`; }
function osloOffset(ms){ // CET/CEST
  const y=new Date(ms).getUTCFullYear();
  const lastSun=(m)=>{const d=new Date(Date.UTC(y,m+1,0,1));d.setUTCDate(d.getUTCDate()-d.getUTCDay());return d.getTime();};
  return (ms>=lastSun(2)&&ms<lastSun(9))?2:1;
}

  const pk = (S.pack[pid]||[]).filter(i=>!i.del);
  const packDone = pk.length>=5 && pk.every(i=>i.done);
  let points = CHALLENGES.reduce((a,x)=>a+(has(x.id)?x.p:0),0) + quizRight*5;
  const s = {has,catCount,quizRight,packDone,points};
  const badges = BADGES.filter(b=>b.test(s)).map(b=>b.id);
  s.points += badges.length*10;
  s.badges = badges;
  return s;
}

const NEWS_FEED = "https://news.google.com/rss/search?q=Maldives%20when%3A3d&hl=en-GB&gl=GB&ceid=GB:en";
const NEWS_SITES = [["The Edition","https://edition.mv"],["Sun Online","https://en.sun.mv"],["PSM News","https://psmnews.mv/en"],["Google Nyheter","https://news.google.com/search?q=Maldives&hl=en-GB&gl=GB&ceid=GB:en"]];
let newsBusy=false;
function cleanNews(items){
  const seen=new Set();
  return items.map(i=>{ let t=String(i.t||"").trim(), src=String(i.src||"").trim(); const m=t.match(/^(.*)\s[-–]\s([^-–]+)$/); if(m&&!src){ t=m[1]; src=m[2]; } else if(m&&src&&m[2].trim()===src){ t=m[1]; }
    return {t, src, link:/^https:\/\//.test(i.link||"")?i.link:"", d:Date.parse(i.d)||0}; })
   .filter(i=>i.t && !seen.has(i.t) && seen.add(i.t)).sort((a,b)=>b.d-a.d).slice(0,8);
}
function parseRSS(xml){ const doc=new DOMParser().parseFromString(xml,"text/xml"); return [...doc.querySelectorAll("item")].map(it=>({t:it.querySelector("title")?.textContent, link:it.querySelector("link")?.textContent, d:it.querySelector("pubDate")?.textContent, src:it.querySelector("source")?.textContent})); }
async function fetchNews(){
  const enc=encodeURIComponent(NEWS_FEED);
  const tries=[
    async()=>{ const j=await getJSON(`https://api.rss2json.com/v1/api.json?rss_url=${enc}`); if(j.status!=="ok") throw 0; return j.items.map(i=>({t:i.title,link:i.link,d:i.pubDate,src:i.author||""})); },
    async()=>{ const r=await fetch(`https://api.allorigins.win/raw?url=${enc}`); if(!r.ok) throw 0; return parseRSS(await r.text()); },
    async()=>{ const r=await fetch(`https://corsproxy.io/?url=${enc}`); if(!r.ok) throw 0; return parseRSS(await r.text()); }
  ];
  for(const t of tries){ try{ const items=cleanNews(await t()); if(items.length) return items; }catch(e){} }
  return null;
}
async function refreshNews(force){
  if(newsBusy) return; const fresh = S.news && S.news.ts && now()-S.news.ts < 4*3600e3;
  if(fresh && !force) return;
  newsBusy=true; const items=await fetchNews(); newsBusy=false;

}

/* Global havstigning i meter (median) relativt til 1995–2014, fra IPCC AR6 WG1 (SPM og kap. 9).
   Mellom støttepunktene er tallene interpolert lineært. */
const SLR = {
  lav:   {n:"Lave utslipp (SSP1-2.6)",  pts:[[2020,0.05],[2030,0.09],[2050,0.19],[2100,0.44],[2150,0.68]], hi2100:0.62},

  hoy:   {n:"Høye utslipp (SSP5-8.5)",  pts:[[2020,0.05],[2030,0.10],[2050,0.23],[2100,0.77],[2150,1.32]], hi2100:1.01},
  verst: {n:"Verste tilfelle (lite sannsynlig)",pts:[[2020,0.05],[2030,0.10],[2050,0.30],[2100,1.90],[2150,4.80]], hi2100:null}
};
const SLR_EXTRA = {mid:[0,"Vanlig vannstand"], flo:[0.5,"Springflo (+0,5 m)"], storm:[1.2,"Springflo og store bølger (+1,2 m)"]};

  {n:"Typisk lokal øy",h:1.0,lat:3.1,lon:73.62,note:"Rundt 80 % av landarealet ligger under 1 meter."},
  {n:"Jawakara (Mabin)",h:1.3,lat:5.42,lon:73.50,note:"Anslag. Høyden på øya er ikke målt i noen kilde vi har.",me:true},
  {n:"Malé",h:1.3,lat:4.175,lon:73.51,note:"Hovedstaden, delvis beskyttet av en sjømur bygget etter 1987."},

  {n:"Villingili, Addu (høyeste punkt)",h:2.4,lat:-0.68,lon:73.19,note:"Landets høyeste naturlige punkt, rundt 2,4 meter."}

const ATOLLS = [["Haa Alif",6.95,72.95,.32,.2],["Haa Dhaalu",6.6,73.05,.25,.16],["Shaviyani",6.3,73.25,.22,.16],["Noonu",5.85,73.35,.24,.18],["Raa",5.6,72.95,.25,.18],["Lhaviyani",5.35,73.5,.18,.14],["Baa",5.15,73.0,.22,.17],["Kaafu",4.35,73.5,.3,.14],["Alif Alif",4.05,72.9,.2,.13],["Alif Dhaal",3.6,72.85,.17,.12],["Vaavu",3.5,73.5,.16,.12],["Faafu",3.2,72.95,.16,.12],["Meemu",2.95,73.52,.2,.12],["Dhaalu",2.85,72.95,.15,.12],["Thaa",2.35,73.1,.2,.17],["Laamu",1.9,73.4,.18,.15],["Gaafu Alif",0.6,73.3,.3,.2],["Gaafu Dhaalu",0.25,73.18,.24,.18],["Gnaviyani",-0.3,73.43,.04,.04],["Addu",-0.63,73.15,.1,.07]];
let slr = {year:2050, sc:"mid", ex:"flo", playing:null};
function slrAt(sc,year){ const p=SLR[sc].pts; if(year<=p[0][0]) return p[0][1]; for(let i=1;i<p.length;i++){ if(year<=p[i][0]){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; return y0+(y1-y0)*(year-x0)/(x1-x0);} } return p[p.length-1][1]; }
function slrYearFor(sc,h,extra){ for(let y=2020;y<=2150;y++) if(slrAt(sc,y)+extra>=h) return y; return null; }

function slrUpdate(){
  const sc=slr.sc, y=slr.year, extra=SLR_EXTRA[slr.ex][0], rise=slrAt(sc,y), water=rise+extra;
  const yl=$("#slrYearL"); if(yl) yl.textContent=y;
  const flooded=SLR_PLACES.filter(p=>water>=p.h).length;
  $("#slrStats").innerHTML=`<div><b class="num">+${nf(rise*100)} cm</b><span>havstigning i ${y}</span></div><div><b class="num">${nf(water,2)} m</b><span>vannstand over dagens middelvann</span></div><div><b class="num">${flooded} av ${SLR_PLACES.length}</b><span>steder under vann</span></div>`;
  // map
  const W=360,H=560, la0=7.3, la1=-0.95, lo0=72.4, lo1=74.0;
  const X=lo=>20+(lo-lo0)/(lo1-lo0)*(W-40), Y=la=>16+(la0-la)/(la0-la1)*(H-32), R=d=>d/(lo1-lo0)*(W-40);
  const sea = Math.min(1, water/2.4);
  const atollFill = `color-mix(in srgb, var(--palm) ${Math.round(100-sea*85)}%, var(--lagoon))`;
  $("#slrMap").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forenklet kart over Maldivenes atoller" style="max-width:420px;margin:0 auto">
    <rect width="${W}" height="${H}" rx="14" fill="var(--sea)" opacity=".18"/>
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="6" y="${Y(0)-4}" font-size="10" fill="var(--muted)">Ekvator</text>
    ${ATOLLS.map(([n,la,lo,rx,ry])=>`<ellipse cx="${X(lo)}" cy="${Y(la)}" rx="${R(rx*.6)}" ry="${R(ry*.6)}" fill="none" stroke="${atollFill}" stroke-width="4" stroke-dasharray="3 4" opacity=".9"/><text x="${X(lo)+R(rx*.6)+4}" y="${Y(la)+3}" font-size="9" fill="var(--muted)">${n}</text>`).join("")}
    ${SLR_PLACES.map(p=>{ const under=water>=p.h; return `<g><circle cx="${X(p.lon)}" cy="${Y(p.lat)}" r="${p.me?8:6}" fill="${under?"var(--coral)":"var(--good)"}" stroke="var(--card)" stroke-width="2"/>${p.me?`<circle cx="${X(p.lon)}" cy="${Y(p.lat)}" r="13" fill="none" stroke="var(--coral)" stroke-width="2"/>`:""}</g>`; }).join("")}
    <text x="${X(73.5)-14}" y="${Y(5.42)-16}" font-size="11" font-weight="800" fill="var(--ink)" text-anchor="end">Jawakara</text>
    <text x="${X(73.53)+12}" y="${Y(4.19)+4}" font-size="11" font-weight="800" fill="var(--ink)">Malé</text>
    <g transform="translate(14 ${H-46})"><circle cx="6" cy="6" r="6" fill="var(--good)"/><text x="18" y="10" font-size="11" fill="var(--ink)">Over vann</text><circle cx="6" cy="26" r="6" fill="var(--coral)"/><text x="18" y="30" font-size="11" fill="var(--ink)">Under vann ved valgt vannstand</text></g>
  </svg>`;
  // profile of Mabin (assumed)
  const prof=[[0,-0.6],[20,-0.2],[35,0.4],[55,0.9],[80,1.2],[120,1.4],[150,1.5],[180,1.45],[220,1.3],[250,1.0],[270,0.6],[285,0.2],[300,-0.4]];
  const PW=640,PH=220,pl=40,pr=12,pt=14,pb=26, hmin=-0.8, hmax=Math.max(2.6, water+0.3);
  const PX=x=>pl+x/300*(PW-pl-pr), PY=h=>pt+(hmax-h)/(hmax-hmin)*(PH-pt-pb);
  const ground=`M${PX(0)},${PY(hmin)} `+prof.map(([x,h])=>`L${PX(x).toFixed(1)},${PY(h).toFixed(1)}`).join(" ")+` L${PX(300)},${PY(hmin)} Z`;
  const ticks=[]; for(let v=0; v<=hmax; v+=0.5) ticks.push(v);
  const hAt=x=>{ for(let i=1;i<prof.length;i++){ const [x0,h0]=prof[i-1],[x1,h1]=prof[i]; if(x<=x1) return h0+(h1-h0)*(x-x0)/(x1-x0);} return prof[prof.length-1][1]; };
  let land=0,wet=0; for(let x=0;x<=300;x++){ const h=hAt(x); if(h>0){ land++; if(h<=water) wet++; } }
  const pct=Math.round(wet/land*100);
  $("#slrProfile").innerHTML=`<svg viewBox="0 0 ${PW} ${PH}" role="img" aria-label="Tverrsnitt av Mabin med vannstand">
    ${ticks.map(v=>`<line x1="${pl}" x2="${PW-pr}" y1="${PY(v)}" y2="${PY(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${PY(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(v,1)} m</text>`).join("")}
    <path d="${ground}" fill="var(--sun)" opacity=".55"/>
    <g transform="translate(${PX(150)} ${PY(1.5)})"><path d="M-2 0 C-3 -18 -1 -34 4 -48 l3 1 C3 -34 2 -18 2 0z" fill="var(--palm)"/><path d="M5 -48c-8-8-20-9-30-3 10-1 19 2 26 6zM5 -48c4-9 15-14 26-11-10 2-18 7-23 13zM5 -48c-1-10-9-16-19-18 8 4 13 10 16 19z" fill="var(--palm)"/></g>
    <rect x="${pl}" y="${PY(water)}" width="${PW-pl-pr}" height="${PY(hmin)-PY(water)}" fill="var(--lagoon)" opacity=".45"/>
    <line x1="${pl}" x2="${PW-pr}" y1="${PY(water)}" y2="${PY(water)}" stroke="var(--sea)" stroke-width="2.5"/>
    <line x1="${pl}" x2="${PW-pr}" y1="${PY(0)}" y2="${PY(0)}" stroke="var(--muted)" stroke-dasharray="5 4"/>
    <text x="${PW-pr-4}" y="${PY(0)+14}" text-anchor="end" font-size="11" fill="var(--muted)">dagens middelvann</text>
    <text x="${pl+6}" y="${PY(water)-6}" font-size="12" font-weight="800" fill="var(--sea)">vannstand ${nf(water,2)} m</text>
    <text x="${PX(150)}" y="${PH-6}" text-anchor="middle" font-size="12" font-weight="800" fill="${pct>0?"var(--coral)":"var(--good)"}">${pct>=100?"Hele øya under vann":pct>0?`Ca. ${pct} % av øya under vann`:"Øya er tørr"}</text>
  </svg>`;
  // list
  $("#slrList").innerHTML=SLR_PLACES.slice().sort((a,b)=>a.h-b.h).map(p=>{ const yr=slrYearFor(sc,p.h,extra); const under=water>=p.h;
    return `<div class="li"><span class="pill ${under?"coral":"good"}" style="min-width:64px;text-align:center">${under?"Under":"Tørt"}</span><div class="t"><b>${esc(p.n)}</b> <span class="small muted num">ca. ${nf(p.h,1)} m</span><div class="small muted">${esc(p.note)}</div></div><b class="num small" style="text-align:right">${yr?(yr<=2020?"allerede":"ca. "+yr):"etter 2150"}</b></div>`; }).join("")+`<p class="note" style="margin-top:8px">Året vannet når stedet med valgt scenario og vannstand.</p>`;
}
function bindSlr(){
  const r=$("#slrYear"); r.addEventListener("input",()=>{slr.year=+r.value; slrUpdate();});
  document.querySelectorAll("[data-slrsc]").forEach(b=>b.addEventListener("click",()=>{slr.sc=b.dataset.slrsc; document.querySelectorAll("[data-slrsc]").forEach(x=>x.setAttribute("aria-pressed",x===b)); slrUpdate();}));
  document.querySelectorAll("[data-slrex]").forEach(b=>b.addEventListener("click",()=>{slr.ex=b.dataset.slrex; document.querySelectorAll("[data-slrex]").forEach(x=>x.setAttribute("aria-pressed",x===b)); slrUpdate();}));

  });
  slrUpdate();
}

function wxKind(c){ if(c==null) return "clear"; if(c>=95) return "storm"; if(c>=51) return "rain"; if(c>=45) return "fog"; if(c===3) return "cloudy"; if(c>=1) return "partly"; return "clear"; }
function sceneSVG(kind, day){
  const sky = !day ? ["#0b2140","#2b4f7a"] : kind==="clear"?["#2aa9e0","#bff0ff"] : kind==="partly"?["#4bb3dc","#d2f1fb"] : kind==="cloudy"||kind==="fog"?["#7d9fb0","#d3e2e8"] : ["#557789","#a9c2cc"];
  const seaTop = day ? "#3fd6cf" : "#1c5f73", seaBot = day ? "#0a6c86" : "#06303f";
  const cloud = (x,y,s,o,cls)=>`<g class="${cls}" opacity="${o}"><g transform="translate(${x} ${y}) scale(${s})" fill="${day?"#fff":"#9fb3c8"}"><ellipse cx="0" cy="0" rx="46" ry="22"/><circle cx="-22" cy="-8" r="20"/><circle cx="8" cy="-18" r="26"/><circle cx="34" cy="-4" r="18"/></g></g>`;
  const showSun = day && (kind==="clear"||kind==="partly");
  let clouds = "";
  if(kind==="partly") clouds = cloud(170,70,1,.95,"drift")+cloud(380,110,.7,.85,"drift2");
  if(kind==="cloudy"||kind==="fog") clouds = cloud(140,70,1.2,.95,"drift")+cloud(360,60,1.4,.95,"drift2")+cloud(540,95,1,.9,"drift");
  if(kind==="rain"||kind==="storm") clouds = cloud(160,60,1.3,.95,"drift")+cloud(380,55,1.5,.95,"drift2")+cloud(560,75,1.1,.95,"drift");
  let drops = "";
  if(kind==="rain"||kind==="storm"){ for(let i=0;i<26;i++){ const x=60+i*22+(i%3)*7, y=95+(i%4)*8; drops+=`<line class="drop" style="animation-delay:${(i*0.13%1.1).toFixed(2)}s" x1="${x}" y1="${y}" x2="${x-4}" y2="${y+12}" stroke="#e8f6ff" stroke-width="2.5" stroke-linecap="round"/>`; } }
  const bolt = kind==="storm" ? `<path d="M400 90 l-18 40 h16 l-12 34 32-46 h-17 l12-28z" fill="#ffd34d"/>` : "";
  let stars = ""; if(!day){ for(let i=0;i<30;i++){ const x=(i*97)%640, y=10+((i*53)%120); stars+=`<circle cx="${x}" cy="${y}" r="${i%5?1.1:1.8}" fill="#fff" opacity="${.5+(i%3)*.2}"/>`; } }
  const rays = Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180; return `<line x1="${(Math.cos(a)*54).toFixed(1)}" y1="${(Math.sin(a)*54).toFixed(1)}" x2="${(Math.cos(a)*74).toFixed(1)}" y2="${(Math.sin(a)*74).toFixed(1)}"/>`;}).join("");
  return `<svg viewBox="0 0 640 270" role="img" aria-label="Værillustrasjon">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>

function wxSceneCard(){

function tideExtremes(m){
  const t=m.hourly.time, h=m.hourly.sea_level_height_msl, out=[];
  for(let i=1;i<h.length-1;i++){ if(h[i]==null) continue; if(h[i]>h[i-1]&&h[i]>=h[i+1]) out.push({t:t[i]*1000,v:h[i],hi:true}); if(h[i]<h[i-1]&&h[i]<=h[i+1]) out.push({t:t[i]*1000,v:h[i],hi:false}); }
  return out;
}
function tideChart(m){
  const t=m.hourly.time.map(x=>x*1000), h=m.hourly.sea_level_height_msl;
  const n=now(); const idx=t.map((x,i)=>i).filter(i=>t[i]>=n-3*3600e3 && t[i]<=n+48*3600e3 && h[i]!=null);
  if(idx.length<4) return "";
  const W=640,H=200,P={l:40,r:12,t:14,b:28};
  const xs=idx.map(i=>t[i]), ys=idx.map(i=>h[i]);
  const x0=xs[0],x1=xs[xs.length-1], ymin=Math.min(...ys)-0.05, ymax=Math.max(...ys)+0.05;
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  const pts=idx.map(i=>`${X(t[i]).toFixed(1)},${Y(h[i]).toFixed(1)}`).join(" ");
  const area=`M${X(x0)},${H-P.b} L${pts.split(" ").join(" L")} L${X(x1)},${H-P.b} Z`;
  const ticks=[]; for(let v=Math.ceil(ymin*10)/10; v<=ymax; v+=0.2) ticks.push(+v.toFixed(1));
  const hours=[]; const first=Math.ceil((x0+TRIP.islandOffset*3600e3)/(6*3600e3))*(6*3600e3)-TRIP.islandOffset*3600e3; for(let v=first; v<=x1; v+=6*3600e3) hours.push(v);
  const ex=tideExtremes(m).filter(e=>e.t>=x0&&e.t<=x1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tidevann de neste 48 timene">
    ${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(v,1)}</text>`).join("")}
    ${hours.map(v=>`<text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtInOffset(v,TRIP.islandOffset)}</text>`).join("")}
    <path d="${area}" fill="var(--lagoon)" opacity=".25"/>
    <polyline points="${pts}" fill="none" stroke="var(--sea)" stroke-width="2.5" stroke-linejoin="round"/>
    ${n>=x0&&n<=x1?`<line x1="${X(n)}" x2="${X(n)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--coral)" stroke-width="2" stroke-dasharray="4 3"/><text x="${X(n)+4}" y="${P.t+10}" font-size="11" fill="var(--coral)" font-weight="700">nå</text>`:""}
    ${ex.map(e=>`<circle cx="${X(e.t)}" cy="${Y(e.v)}" r="4" fill="${e.hi?"var(--sea)":"var(--coral)"}"/>`).join("")}
  </svg>`;
}

let liveBusy=false;
async function getJSON(url){ const r = await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function refreshLive(force){
  if(liveBusy) return; const n=now();
  const stale = k => force || !S[k] || !S[k].ts || n - S[k].ts > (k==="fx"?6*3600e3:30*60e3);
  if(!stale("wx") && !stale("marine") && !stale("fx")) return;
  liveBusy=true; let changed=false;
  const {lat,lon}=TRIP;
  const jobs=[];
  if(stale("wx")) jobs.push(getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_sum,sunrise,sunset&timezone=GMT&timeformat=unixtime&forecast_days=7&wind_speed_unit=ms`).then(j=>{S.wx={current:j.current,daily:j.daily,ts:n};changed=true;}).catch(()=>{}));
  if(stale("marine")) jobs.push(getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,sea_surface_temperature&hourly=sea_level_height_msl&timezone=GMT&timeformat=unixtime&past_days=1&forecast_days=3`).then(j=>{S.marine={current:j.current,hourly:j.hourly,ts:n};changed=true;}).catch(()=>{}));
  if(stale("fx")) jobs.push(getJSON(`https://open.er-api.com/v6/latest/USD`).then(j=>{ if(j&&j.rates&&j.rates.NOK){S.fx={NOK:j.rates.NOK,MVR:j.rates.MVR,EUR:j.rates.EUR,USD:1,ts:n};changed=true;} }).catch(()=>{}));
  await Promise.all(jobs); liveBusy=false;
  if(changed){ save(); const tab=location.hash.slice(1)||"hjem"; if(tab==="hjem"||(tab==="mer"&&["vaer","valuta"].includes(sub.mer))) render(tab); }
  else if(force) toast("Fikk ikke kontakt. Viser siste lagrede data.");
}

function exportCode(){

function mergeList(a,b){ const m=new Map(); [...(a||[]),...(b||[])].forEach(x=>{ const c=m.get(x.id); if(!c || (x.ts||0)>(c.ts||0)) m.set(x.id,x); }); return [...m.values()]; }
function mergeMap(a,b){ const out={...(a||{})}; Object.entries(b||{}).forEach(([k,v])=>{ if(!out[k] || (v.ts||0)>(out[k].ts||0)) out[k]=v; }); return out; }
function importCode(txt){
  txt = txt.trim(); const i = txt.indexOf("JAWA1:"); if(i<0) throw new Error("format");
  importData(JSON.parse(decodeURIComponent(escape(atob(txt.slice(i+6).replace(/\s/g,""))))));
}
function exportData(){ return {profiles:S.profiles,done:S.done,quiz:S.quiz,pack:S.pack,shop:S.shop,plan:S.plan,flights:S.flights}; }
function importData(d){
  S.profiles = mergeList(S.profiles,d.profiles).sort((a,b)=>a.id.localeCompare(b.id));
  const ids = new Set([...Object.keys(S.done),...Object.keys(d.done||{})]); ids.forEach(k=>S.done[k]=mergeMap(S.done[k],(d.done||{})[k]));
  const qids = new Set([...Object.keys(S.quiz),...Object.keys(d.quiz||{})]); qids.forEach(k=>S.quiz[k]=mergeMap(S.quiz[k],(d.quiz||{})[k]));
  const pids = new Set([...Object.keys(S.pack),...Object.keys(d.pack||{})]); pids.forEach(k=>S.pack[k]=mergeList(S.pack[k],(d.pack||{})[k]));
  S.shop = mergeList(S.shop,d.shop); S.plan = mergeList(S.plan,d.plan); S.flights = mergeList(S.flights,d.flights);
  save();
}

  if(FB.status!=="ok"||!FB.fam) return;
  clearTimeout(FB.pushT);
  FB.pushT=setTimeout(()=>{ const data=JSON.stringify(exportData()); if(data===FB.lastPushed) return; FB.lastPushed=data;
    FB.db.doc(famPath()+"/enheter/"+DEV).set({data,who:S.me||"",ts:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{FB.lastPushed="";}); }, now_?200:1500);
}
function joinFamily(code){
  code=String(code||"").trim().replace(/^.*familie-/,"").replace(/[^A-Za-z0-9]/g,"");
  if(code.length<12) return false;
  FB.fam=code; lsSet("fam",code); if(FB.status==="ok") fbListen(); else fbInit(); return true;
}
function inviteLink(){ return `${location.origin}${location.pathname}#familie-${FB.fam}`; }
function updateBadge(){
  const last=+(lsGet("lastread")||0), b=$("#chatBadge"); if(!b) return;
  const n=FB.msgs.filter(m=>m.uid!==FB.uid && msTs(m)>last).length;
  b.hidden = !n || curTab()==="chat"; b.textContent = n>9?"9+":n;
}
const msTs = m => m.ts && m.ts.toMillis ? m.ts.toMillis() : (m.cts||0);
VIEWS.chat = () => {
  if(FB.status==="noconfig") return `<section class="card"><div class="card-h"><h2>Familiechat</h2><span class="pill warn">Kommer snart</span></div><p>Her skal familien snakke sammen om reisen. Chatten blir aktiv så snart Firebase er satt opp. Da deles også poeng, pakkelister og plan automatisk mellom telefonene.</p></section>`;
  if(FB.status==="error") return `<section class="card"><div class="card-h"><h2>Familiechat</h2></div><div class="empty">Fikk ikke kontakt med chatten. Sjekk nettet og prøv igjen.</div><div class="row" style="margin-top:10px"><button class="btn" type="button" id="fbRetry">Prøv igjen</button></div></section>`;
  if(!FB.fam) return `<section class="card"><div class="card-h"><h2>Familiechat</h2></div>
    <p>Én i familien starter chatten og sender invitasjonslenken til de andre. Alle som har lenken, kan lese og skrive.</p>
    <div class="row" style="margin-top:12px"><button class="btn" type="button" id="famNew">Start familiechatten</button></div>
    <label class="f" style="margin-top:16px">Har du fått en invitasjon? Lim inn lenken eller koden<input type="text" id="famCode" autocomplete="off"></label>
    <div class="row" style="margin-top:8px"><button class="btn ghost" type="button" id="famJoin">Bli med</button></div></section>`;
  return `<section class="card" style="padding-bottom:4px"><div class="card-h"><h2>Familiechat</h2><button class="btn ghost sm" type="button" id="famInvite">Inviter</button></div>
    <div class="chat" id="chatList" aria-live="polite"></div>
    <form class="chatbar" id="chatForm"><textarea id="chatTxt" rows="1" placeholder="Skriv til familien som ${esc(me().name.split(" ")[0])}" aria-label="Melding"></textarea><button class="btn coral" type="submit">Send</button></form></section>`;
};
function renderChatList(){
  const el=$("#chatList"); if(!el) return;
  if(FB.status!=="ok" && !FB.msgs.length){ el.innerHTML=`<div class="empty">Kobler til …</div>`; return; }
  if(!FB.msgs.length){ el.innerHTML=`<div class="empty">Ingen meldinger ennå. Si hei! Forslag: «Hvem blir med på snorkling i morgen tidlig?»</div>`; return; }
  let lastDay=""; const out=[];
  FB.msgs.forEach(m=>{ const t=msTs(m), d=new Date(t); const day=d.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});
    if(day!==lastDay){ out.push(`<div class="daysep">${esc(day)}</div>`); lastDay=day; }
    const p=prof(m.pid)||{name:"Ukjent",emoji:"🐚"}; const mine=m.uid===FB.uid;
    out.push(`<div class="msg ${mine?"mine":""}"><div class="meta who">${mine?"":`<span>${esc(p.emoji)}</span><span>${esc(p.name.split(" ")[0])}</span>`}<span>${d.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"})}</span></div><div class="bub">${esc(m.text)}</div></div>`); });
  el.innerHTML=out.join("");
  lsSet("lastread", String(Date.now())); updateBadge();
  setTimeout(()=>window.scrollTo(0,document.documentElement.scrollHeight),50);
}
AFTER.chat = () => {
  fbInit();
  const r=$("#fbRetry"); r&&r.addEventListener("click",()=>{FB.status="idle";fbInit();});
  const n=$("#famNew"); n&&n.addEventListener("click",()=>{ joinFamily(uid()+uid()+uid()); render("chat"); toast("Familiechatten er startet. Inviter de andre!"); });
  const j=$("#famJoin"); j&&j.addEventListener("click",()=>{ if(joinFamily($("#famCode").value)){ render("chat"); toast("Du er med i familiechatten!"); } else toast("Fant ingen gyldig kode."); });
  const inv=$("#famInvite"); inv&&inv.addEventListener("click",async()=>{ const text=`Bli med i familiechatten i Jawakara-appen: ${inviteLink()}`;
    if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(text); toast("Lenken er kopiert."); }catch(e){ toast(inviteLink()); } });
  const f=$("#chatForm");
  if(f){ renderChatList();
    const ta=$("#chatTxt"); ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";});
    ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!/iPhone|iPad|Android/.test(navigator.userAgent)){ e.preventDefault(); f.requestSubmit(); } });
    f.addEventListener("submit",e=>{ e.preventDefault(); const text=ta.value.trim(); if(!text||FB.status!=="ok") return; ta.value=""; ta.style.height="";
      FB.db.collection(famPath()+"/meldinger").add({text:text.slice(0,2000),pid:S.me||"p1",uid:FB.uid,cts:Date.now(),ts:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>toast("Meldingen ble ikke sendt. Prøv igjen.")); });
  }
};

/* ---------- SHEET ---------- */
function sheet(html,bind){
  closeSheet(); const bg=document.createElement("div"); bg.className="sheet-bg"; bg.id="sheetBg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(bg);
  bg.addEventListener("click",e=>{ if(e.target===bg||e.target.hasAttribute("data-close")) closeSheet(); });
  bind&&bind(bg); const f=bg.querySelector("input,select,button"); f&&f.focus();
}
function closeSheet(){ const b=$("#sheetBg"); b&&b.remove(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
function pickMe(first){
  sheet(`<h2>${first?"Velkommen! Hvem er du?":"Bytt profil"}</h2><p class="muted">Poeng og pakkeliste følger profilen du velger. Du kan bytte når som helst.</p>
    <div class="stack">${S.profiles.map(p=>`<button type="button" class="btn ghost" style="display:flex;align-items:center;gap:12px;text-align:left" data-pick="${p.id}"><span class="av">${esc(p.emoji)}</span>${esc(p.name)}</button>`).join("")}</div>`,
  root=>root.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{ S.me=b.dataset.pick; chWho=null; packWho=null; quizState=null; save(); closeSheet(); render(); toast(`Hei, ${me().name.split(" ")[0]}!`); })));
}
$("#meBtn").addEventListener("click",()=>pickMe(false));

/* ================= BOOT ================= */
load();
window.addEventListener("hashchange",route);
route();
if(!S.me) setTimeout(()=>pickMe(true),300);
if(FIREBASE_CONFIG && FB.fam) fbInit();
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|claudeusercontent/.test(location.host)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refreshLive(); if(curTab()==="hjem") refreshNews(); } });
</script>
